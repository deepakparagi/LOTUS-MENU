<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>LOTUS HOTEL INN — QR Menu Generator</title>
  <meta name="description" content="Generate the luxury tabletop QR menu card for LOTUS HOTEL INN." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root {
      --gold-100: #FFF8E7;
      --gold-200: #F0D5A8;
      --gold-300: #D4A574;
      --gold-400: #C49B5A;
      --gold-500: #A67C3D;
      --dark-900: #0A0A0A;
      --dark-800: #111111;
      --dark-700: #1A1A1A;
      --text-primary: #F5F0E8;
      --text-secondary: #9A9186;
      --text-muted: #5A554E;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background: var(--dark-900);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* ═══ CONTROLS (screen only) ═══ */
    .controls {
      max-width: 500px;
      width: 100%;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .controls h2 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--gold-200);
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
    }

    .controls p {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .input-group input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--dark-700);
      border: 1px solid rgba(212, 165, 116, 0.15);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--gold-400);
    }

    .input-group input::placeholder {
      color: var(--text-muted);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
      border: none;
      border-radius: 8px;
      color: var(--dark-900);
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(212, 165, 116, 0.1);
      border: 1px solid rgba(212, 165, 116, 0.2);
      color: var(--gold-200);
    }

    .btn-secondary:hover {
      background: rgba(212, 165, 116, 0.18);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ═══ THE QR CARD ═══ */
    .qr-card-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .qr-card {
      /* A5 proportions: 148mm × 210mm ≈ 1:1.414 */
      width: 380px;
      height: 537px;
      position: relative;
      background: var(--dark-900);
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(212, 165, 116, 0.08),
        inset 0 0 120px rgba(212, 165, 116, 0.02);
    }

    /* Ornamental gold border inset */
    .qr-card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(212, 165, 116, 0.12);
      border-radius: 10px;
      pointer-events: none;
      z-index: 2;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 3;
    }
    .corner svg {
      width: 100%;
      height: 100%;
    }
    .corner-tl { top: 8px; left: 8px; }
    .corner-tr { top: 8px; right: 8px; transform: scaleX(-1); }
    .corner-bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
    .corner-br { bottom: 8px; right: 8px; transform: scale(-1, -1); }

    /* Content layout */
    .card-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    /* Lotus watermark */
    .card-watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }

    /* Top accent lines */
    .card-accent-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    .accent-line {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-400));
    }

    .accent-line:last-child {
      background: linear-gradient(90deg, var(--gold-400), transparent);
    }

    .accent-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold-400);
      transform: rotate(45deg);
      opacity: 0.6;
    }

    /* Logo area */
    .card-logo {
      margin-bottom: 0.3rem;
    }

    .card-logo svg {
      width: 52px;
      height: 44px;
      filter: drop-shadow(0 0 12px rgba(212, 165, 116, 0.25));
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(180deg, var(--gold-100), var(--gold-300));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.15rem;
    }

    .card-subtitle {
      font-size: 0.55rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 1.5rem;
    }

    /* Separator */
    .card-separator {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .sep-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 165, 116, 0.2), transparent);
    }

    .sep-text {
      font-size: 0.55rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* QR code container */
    .qr-frame {
      position: relative;
      padding: 14px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.2rem;
    }

    .qr-frame canvas,
    .qr-frame img {
      display: block;
      width: 160px !important;
      height: 160px !important;
    }

    /* Scan instruction */
    .card-scan-text {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-300);
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    .card-scan-desc {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-bottom: 1.5rem;
    }

    /* Bottom credits */
    .card-bottom {
      margin-top: auto;
    }

    .card-credits-sep {
      width: 60px;
      height: 1px;
      background: rgba(212, 165, 116, 0.1);
      margin: 0 auto 0.6rem;
    }

    .card-credits-label {
      font-size: 0.45rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .card-credits-brand {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--gold-400);
      margin-bottom: 0.15rem;
    }

    .card-credits-phone {
      font-size: 0.5rem;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
    }

    /* ═══ PRINT STYLES ═══ */
    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }
      .controls { display: none !important; }
      .qr-card {
        box-shadow: none !important;
        border-radius: 0 !important;
        width: 148mm !important;
        height: 210mm !important;
        margin: 0 auto !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .qr-card {
        width: 320px;
        height: 452px;
      }
      .card-content {
        padding: 2rem 1.5rem;
      }
      .card-title {
        font-size: 1.8rem;
        letter-spacing: 4px;
      }
      .qr-frame {
        padding: 10px;
      }
      .qr-frame canvas,
      .qr-frame img {
        width: 130px !important;
        height: 130px !important;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ Screen-only controls ═══ -->
  <div class="controls">
    <h2>QR Card Generator</h2>
    <p>Enter your deployed menu URL below to generate the QR code for your card.</p>
    <div class="input-group">
      <input type="url" id="url-input" placeholder="https://your-domain.com/" />
      <button class="btn" id="generate-btn">Generate QR</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="print-btn">🖨️ Print / Save PDF</button>
      <button class="btn btn-secondary" id="download-btn">⬇ Download QR Image</button>
    </div>
  </div>

  <!-- ═══ The Premium QR Card ═══ -->
  <div class="qr-card-wrapper">
    <div class="qr-card" id="qr-card">

      <!-- Corner ornaments -->
      <div class="corner corner-tl"><svg viewBox="0 0 28 28"><path d="M2 26V8C2 4.686 4.686 2 8 2H26" stroke="rgba(212,165,116,0.25)" stroke-width="1" fill="none"/><circle cx="4" cy="4" r="1.5" fill="rgba(212,165,116,0.2)"/></svg></div>
      <div class="corner corner-tr"><svg viewBox="0 0 28 28"><path d="M2 26V8C2 4.686 4.686 2 8 2H26" stroke="rgba(212,165,116,0.25)" stroke-width="1" fill="none"/><circle cx="4" cy="4" r="1.5" fill="rgba(212,165,116,0.2)"/></svg></div>
      <div class="corner corner-bl"><svg viewBox="0 0 28 28"><path d="M2 26V8C2 4.686 4.686 2 8 2H26" stroke="rgba(212,165,116,0.25)" stroke-width="1" fill="none"/><circle cx="4" cy="4" r="1.5" fill="rgba(212,165,116,0.2)"/></svg></div>
      <div class="corner corner-br"><svg viewBox="0 0 28 28"><path d="M2 26V8C2 4.686 4.686 2 8 2H26" stroke="rgba(212,165,116,0.25)" stroke-width="1" fill="none"/><circle cx="4" cy="4" r="1.5" fill="rgba(212,165,116,0.2)"/></svg></div>

      <!-- Lotus watermark -->
      <svg class="card-watermark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 10C90 30 75 60 75 90C75 120 85 145 100 160C115 145 125 120 125 90C125 60 110 30 100 10Z" fill="rgba(212,165,116,1)"/>
        <path d="M100 30C80 50 45 75 30 100C15 125 25 148 100 160C175 148 185 125 170 100C155 75 120 50 100 30Z" fill="rgba(212,165,116,0.5)"/>
        <path d="M100 50C75 65 30 85 15 110C0 135 15 150 100 160C185 150 200 135 185 110C170 85 125 65 100 50Z" fill="rgba(212,165,116,0.3)"/>
      </svg>

      <div class="card-content">

        <!-- Top accent -->
        <div class="card-accent-top">
          <div class="accent-line"></div>
          <div class="accent-diamond"></div>
          <div class="accent-line"></div>
        </div>

        <!-- Logo -->
        <div class="card-logo">
          <svg viewBox="0 0 60 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 4C27 10 22 18 22 26C22 34 26 42 30 46C34 42 38 34 38 26C38 18 33 10 30 4Z" fill="url(#cg1)" opacity="0.9"/>
            <path d="M30 10C24 16 14 22 10 30C6 38 10 44 30 46C50 44 54 38 50 30C46 22 36 16 30 10Z" fill="url(#cg1)" opacity="0.5"/>
            <path d="M30 16C22 20 8 26 4 32C0 38 6 44 30 46C54 44 60 38 56 32C52 26 38 20 30 16Z" fill="url(#cg1)" opacity="0.3"/>
            <defs><linearGradient id="cg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D4A574"/><stop offset="50%" stop-color="#F0D5A8"/><stop offset="100%" stop-color="#C49B5A"/></linearGradient></defs>
          </svg>
        </div>

        <!-- Title -->
        <h1 class="card-title">LOTUS</h1>
        <p class="card-subtitle">Fine Dining Experience</p>

        <!-- Separator -->
        <div class="card-separator">
          <div class="sep-line"></div>
          <span class="sep-text">Digital Menu</span>
          <div class="sep-line"></div>
        </div>

        <!-- QR Code -->
        <div class="qr-frame" id="qr-frame">
          <canvas id="qr-canvas"></canvas>
        </div>

        <!-- Scan text -->
        <p class="card-scan-text">Scan to View Menu</p>
        <p class="card-scan-desc">Point your camera at the QR code above</p>

        <!-- Credits -->
        <div class="card-bottom">
          <div class="card-credits-sep"></div>
          <p class="card-credits-label">Designed & Developed by</p>
          <p class="card-credits-brand">DeepCipher</p>
          <p class="card-credits-phone">+91 81971 74493</p>
        </div>

      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const generateBtn = document.getElementById('generate-btn');
    const printBtn = document.getElementById('print-btn');
    const downloadBtn = document.getElementById('download-btn');
    const qrCanvas = document.getElementById('qr-canvas');

    // Default placeholder QR
    function generateQR(url) {
      QRCode.toCanvas(qrCanvas, url || 'https://YOUR-DOMAIN.com', {
        width: 160,
        margin: 0,
        color: {
          dark: '#0A0A0A',
          light: '#FFFFFF'
        },
        errorCorrectionLevel: 'H'
      }, function (error) {
        if (error) console.error(error);
      });
    }

    // Generate on page load with default GitHub Pages URL
    const defaultUrl = 'https://deepakparagi.github.io/LOTUS-MENU/';
    urlInput.value = defaultUrl;
    generateQR(defaultUrl);

    generateBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (url) generateQR(url);
    });

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const url = urlInput.value.trim();
        if (url) generateQR(url);
      }
    });

    printBtn.addEventListener('click', () => window.print());

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'lotus-qr-code.png';
      link.href = qrCanvas.toDataURL('image/png');
      link.click();
    });
  </script>

</body>
</html>
